name: test

on:
  push:
  pull_request:

jobs:
  test:
    # 팀원 OS(macOS·Windows)와 제출 환경(Linux)에서 모두 같은 결과가 나오는지 확인한다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked
      - name: 정적 검사 (인코딩 미지정 open 등)
        run: uv run ruff check .
      - name: 테스트
        run: uv run pytest -q
